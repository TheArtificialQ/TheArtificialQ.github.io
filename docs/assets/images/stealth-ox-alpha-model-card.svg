<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-labelledby="title desc">
  <title id="title">HTB-Challenger Benchmark / LLM Model Card</title>
  <desc id="desc">Model Ox Alpha, exact version stealth/ox-alpha, benchmark score 81.4 percent, cost per challenge $0.00, tested 21 August 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="1" stop-color="#0d2633"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#42d9e8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="model-name-clip"><rect x="106" y="70" width="429" height="45"/></clipPath>
  </defs>
  <rect width="800" height="230" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="228" rx="17" fill="url(#grid)" stroke="#2f5f6d" stroke-width="2"/>
  <path d="M28 28h48M28 28v18M772 202h-48M772 202v-18" fill="none" stroke="#45e5ef" stroke-width="3"/>
  <text x="38" y="51" fill="#6f98a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.7">HTB-Challenger Benchmark / LLM Model Card</text>
  <rect x="38" y="69" width="54" height="54" rx="11" fill="#eef7f8" stroke="#4d7e89"/>
  <image x="45" y="76" width="40" height="40" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
  <text x="106" y="103" fill="#f2fbfc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750" clip-path="url(#model-name-clip)">Ox Alpha</text>
  <text x="106" y="131" fill="#8db1ba" font-family="Consolas,Menlo,monospace" font-size="13">stealth/ox-alpha</text>
  <line x1="38" y1="151" x2="535" y2="151" stroke="#2b5360"/>
  <text x="38" y="183" fill="#6f98a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">TEST WINDOW</text>
  <text x="164" y="183" fill="#c8dce0" font-family="Consolas,Menlo,monospace" font-size="15">21 August 2026</text>
  <line x1="570" y1="29" x2="570" y2="201" stroke="#2b5360"/>
  <text x="596" y="51" fill="#6f98a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">BENCHMARK SCORE</text>
  <text x="762" y="128" text-anchor="end" fill="#63f3df" filter="url(#glow)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="800">81.4<tspan font-size="30">%</tspan></text>
  <rect x="596" y="141" width="166" height="7" rx="3.5" fill="#183d48"/>
  <rect x="596" y="141" width="135.2" height="7" rx="3.5" fill="#63f3df"/>
  <rect x="596" y="162" width="166" height="36" rx="7" fill="#102e39" stroke="#2b5360"/>
  <text x="606" y="185" fill="#6f98a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".8">COST / CHALLENGE</text>
  <text x="752" y="186" text-anchor="end" fill="#c8dce0" font-family="Consolas,Menlo,monospace" font-size="16" font-weight="700">$0.00</text>
</svg>
